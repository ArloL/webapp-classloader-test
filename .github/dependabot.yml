version: 2
updates:
- package-ecosystem: "maven"
  directory: "/"
  schedule:
    interval: "monthly"
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
- package-ecosystem: "maven"
  directory: "/test-projects/webapp-test-bad-context/"
  schedule:
    interval: "monthly"
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
- package-ecosystem: "maven"
  directory: "/test-projects/webapp-test-keystore/"
  schedule:
    interval: "monthly"
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "monthly"
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  groups:
    github-codeql-action:
      patterns:
      - "github/codeql-action*"
